# Isolated bench ERDDAP for the CTD serving-backend benchmark
# (DuckDB-JDBC vs Parquet vs CSV). Runs on port 8091 with the custom image
# (./erddap = ERDDAP + DuckDB JDBC). Leaves the live `erddap` (8090) untouched.
#
#   docker compose -f docker-compose.bench.yml -p erddap-bench up -d
#   BENCH_ERDDAP_MEMORY=1g docker compose -f docker-compose.bench.yml -p erddap-bench up -d   # heap sweep
#   BENCH_MEM_LIMIT=4g BENCH_ERDDAP_MEMORY=2g docker compose ... up -d                        # container cap sweep
#
# TWO memory knobs, and the difference matters:
#   BENCH_ERDDAP_MEMORY -> the JVM -Xmx (heap only)
#   BENCH_MEM_LIMIT     -> a HARD cgroup cap on the whole container (heap + JVM
#                          overhead + the DuckDB JDBC driver's NATIVE allocation)
# The DuckDB path allocates largely OUTSIDE the Java heap, so -Xmx does not bound
# it. Without a container cap an unconstrained query against the 232M-row
# ctd_measurement view drove host memory to exhaustion and took the live services
# down with it (2026-07-25). mem_limit makes the kernel OOM-kill the BENCH
# container instead of the host, which is both safe and a better measurement:
# "does this dataset serve within N GB?" becomes an answerable question.
#
# The data tree lives under the shared /share mount (host /ssd/share/data), so the
# DuckDB view paths (baked into calcofi_ctd.db) and the NetCDF fileDir resolve
# identically where they're built (rstudio) and read (here). ERDDAP's own state
# (content, /erddapData) is under /share/data/erddap-bench. The shared parquet /
# .db / netcdf are read from /share/data/erddap-duckdb (same as prod erddap).
# See CalCOFI/workflows/bench_erddap_ctd.qmd.
version: "3.7"
services:
  erddap_bench:
    container_name: erddap_bench
    image: calcofi-erddap:duckdb
    build:
      context: ./erddap
      args:
        DUCKDB_JDBC_VERSION: "1.5.2.1"
    restart: "no"
    # HARD cgroup cap on the whole container (docker compose v2 honours mem_limit
    # outside swarm). memswap_limit == mem_limit disables swap, so the cap is real
    # rather than degrading into host-wide thrash. Applies to erddap_bench ONLY —
    # the live `erddap` in docker-compose.yml is a different project/container.
    mem_limit: ${BENCH_MEM_LIMIT:-4g}
    memswap_limit: ${BENCH_MEM_LIMIT:-4g}
    ports:
      - "8091:8080"
    volumes:
      - /share/data/erddap-bench/content:/usr/local/tomcat/content/erddap
      - /share/data/erddap-bench/data:/erddapData
      - /share/data/erddap-bench/staged:/share/data/erddap-bench/staged:ro
      # whole shared data tree (datasets, duckdb, netcdf, parquet_wide, serving, tmp)
      # at the identity path so every dataset block's fileDir/sourceUrl resolves
      - /share/data/erddap-duckdb:/share/data/erddap-duckdb
      # the LIVE dataset tree at the same container path the production erddap uses
      # (/datasets), READ-ONLY, so production dataset blocks can be benchmarked
      # verbatim — needed to answer "which live datasets serve within N GB?"
      - /share/erddap/datasets:/datasets:ro
      - /share/github/CalCOFI/erddap/content/images/calcofi.svg:/usr/local/tomcat/webapps/erddap/images/calcofi.svg:ro
      - /share/github/CalCOFI/erddap/messages.xml:/usr/local/tomcat/webapps/erddap/WEB-INF/classes/gov/noaa/pfel/erddap/util/messages.xml:ro
    environment:
      ERDDAP_MEMORY: ${BENCH_ERDDAP_MEMORY:-2g}
      ERDDAP_baseUrl: http://localhost:8091
      ERDDAP_baseHttpsUrl: http://localhost:8091
      ERDDAP_flagKeyKey: benchflagkey
      ERDDAP_bigParentDirectory: /erddapData/
      ERDDAP_adminInstitution: CalCOFI (bench)
      ERDDAP_adminInstitutionUrl: https://calcofi.io
      ERDDAP_adminIndividualName: CalCOFI Data Manager
      ERDDAP_adminPosition: Data Manager
      ERDDAP_adminCity: La Jolla
      ERDDAP_adminStateOrProvince: CA
      ERDDAP_adminPostalCode: "92037"
      ERDDAP_adminCountry: USA
      ERDDAP_adminEmail: calcofi@ucsd.edu
