version: "3.7"

volumes:
  caddy_data:
  caddy_config:
  shiny_apps:
  postgis_data:

services:
  caddy:
    container_name: caddy
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      # bind-mount the DIRECTORY, not the single Caddyfile: a single-file bind
      # mount pins to the file's inode, so a `git pull` that replaces the file
      # leaves the container reading stale config (then `caddy reload` no-ops).
      # With the dir mounted, the container always sees the current file, so
      # after editing: `git pull` + `docker compose exec caddy caddy reload
      # --config /etc/caddy/Caddyfile` (no container recreate needed).
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      - /share:/share    

  rstudio:
    build:
      context: ./rstudio
      args:
        PASSWORD: $PASSWORD
    container_name: rstudio
    environment:
      ROOT: 'true'
      USER: admin
      PASSWORD: $PASSWORD
      ADD: shiny
    ports:
      - 8787:8787
      - 3838:3838
    restart: unless-stopped
    volumes:
      - /share:/share
      - shiny_apps:/srv/shiny-server
      - /home/bebest/.ssh:/home/bebest/.ssh   # persistent git/SSH identity for bebest (uid 1003 matches host)

  # PostgreSQL 18 + PostGIS 3.6 (upgraded from 17.1/3.5 on 2026-08-19 by dump/restore —
  # scripts/pg_upgrade_18.sh). Two databases: `gis` (legacy 2022 schema; pg_tileserv,
  # api.calcofi.io) and `calcofi` (CTD team QA/QC work; postgis/init/*.sql).
  #
  # VOLUME — read before "cleaning up": the 18 image's VOLUME is /var/lib/postgresql with
  # PGDATA=/var/lib/postgresql/18/docker, so the named volume below IS the data. Under the
  # 17 image the same mount left PGDATA (/var/lib/postgresql/data) on an ANONYMOUS volume
  # (7ea47db1…) — `compose down && up` would have started an empty database. That old
  # volume is kept until the restore is verified, then `docker volume rm`.
  #
  # CONFIG — settings are passed as -c flags here (visible in the diff). The old
  # ./postgis/postgresql.conf bind-mount was a no-op: the server read $PGDATA/postgresql.conf
  # and ran with the 128 MB shared_buffers default on a 15 GB box.
  postgis:
    container_name: postgis
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: $PASSWORD
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=64MB
        -c maintenance_work_mem=1GB
        -c max_wal_size=4GB
        -c random_page_cost=1.1
        -c max_parallel_workers_per_gather=2
        -c shared_preload_libraries=pg_stat_statements
        -c log_connections=on
        -c log_min_duration_statement=5s
        -c log_statement=ddl
        -c track_io_timing=on
        -c timezone=UTC
    # parallel query uses POSIX shm under /dev/shm; Docker's 64 MB default is too small
    shm_size: 1gb
    volumes:
      - postgis_data:/var/lib/postgresql
      - /share:/share
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gis"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # loopback only: the SSH tunnel connects to localhost, and the other services reach it
    # by name on the compose network; GCP's firewall already blocks 5432, this removes the
    # dependency on that.
    ports:
      - "127.0.0.1:5432:5432"
      
  # Nightly pg_dump rotation to /share/pg_backups/{daily,weekly,monthly,last}. The LOCAL
  # rotation is deliberately short (the ssd disk is 200 GB and stays that way — decision D6,
  # 2026-08-19): gs://calcofi-backups/postgres is the long store (rclone/backup.sh ships it
  # at 00:30 UTC, Object Versioning keeps 90 d of anything sync deletes), and
  # scripts/pg_restore_drill.sh proves the off-site copy restores every week. Keep enough
  # room for one dump + one restore of the largest DB; do not grow KEEP_* to "be safe".
  pg_backups:
    container_name: pg_backups
    image: prodrigestivill/postgres-backup-local:18   # pg_dump must be >= server major
    restart: always
    user: postgres:postgres # Optional: see below
    volumes:
      - /share/pg_backups:/backups
      # sudo mkdir /share/pg_backups; sudo chown -R 999:999 /share/pg_backups
    links:
      - postgis
    depends_on:
      - postgis
    environment:
      - POSTGRES_HOST=postgis
      - POSTGRES_DB=gis calcofi
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z6 --blobs
      - SCHEDULE=@daily
      #- SCHEDULE='0 19 * * * *'
      - BACKUP_KEEP_DAYS=3
      - BACKUP_KEEP_WEEKS=2
      - BACKUP_KEEP_MONTHS=2
      - HEALTHCHECK_PORT=8000

  rclone:
    build: ./rclone
    container_name: rclone
    restart: unless-stopped
    environment:
      # optional dead-man's switch pinged by rclone/backup.sh after a successful ship
      # (e.g. a healthchecks.io check URL). Empty = skip. The always-on monitor is the
      # upptime check on https://file.calcofi.io/status/pg_backup.ok (scripts/backup_status.sh).
      - HEALTHCHECKS_URL=${HEALTHCHECKS_URL:-}
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'
    volumes:
      - /share/rclone:/config/rclone
      - /share:/share
      # calcofi-admin SA key for the gdrive->gcs sync (must exist on host first;
      # create with rclone/setup_service_account.sh, then scp to the VM)
      - /etc/rclone/calcofi-admin-sa.json:/config/rclone/calcofi-admin-sa.json:ro

  # pgAdmin 4 (server mode) at https://pgadmin.calcofi.io — pinned; bump deliberately.
  # Users: pre-created with `setup.py add-user` (see README "pgAdmin"); with Google sign-in
  # enabled (.env PGADMIN_AUTH_SOURCES + client id/secret) they log in with their Google
  # account, and OAUTH2_AUTO_CREATE_USER=False keeps it an allow-list — an unknown Google
  # account is refused even though it authenticates. The internal `ben@ecoquants.com`
  # account (PGADMIN_DEFAULT_*) stays as break-glass. Servers `calcofi`/`gis` are registered
  # once by the admin and SHARED, so every user sees them and supplies their own DB password.
  # PGADMIN_CONFIG_* -> /pgadmin4/config_distro.py (Python literals, hence the quoting).
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.17
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ben@ecoquants.com
      PGADMIN_DEFAULT_PASSWORD: ${PASSWORD}
      PGADMIN_LISTEN_PORT: 8088
      # ['internal'] until the Google OAuth client exists; then ['oauth2','internal'] in .env
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "${PGADMIN_AUTH_SOURCES:-['internal']}"
      PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER: "False"
      PGADMIN_CONFIG_OAUTH2_CONFIG: "[{'OAUTH2_NAME':'google','OAUTH2_DISPLAY_NAME':'Google','OAUTH2_CLIENT_ID':'${PGADMIN_OAUTH2_CLIENT_ID:-}','OAUTH2_CLIENT_SECRET':'${PGADMIN_OAUTH2_CLIENT_SECRET:-}','OAUTH2_SERVER_METADATA_URL':'https://accounts.google.com/.well-known/openid-configuration','OAUTH2_SCOPE':'openid email profile','OAUTH2_ICON':'fa-google','OAUTH2_BUTTON_COLOR':'#4285F4'}]"
      # per-user master password encrypts the DB passwords each user chooses to save
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - /share/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgis

  plumber:
    container_name: plumber
    build: ./plumber
    # Mirrors the Dockerfile CMD so the corrected path takes effect on `up -d`
    # WITHOUT a full image rebuild — the image itself is fine, only the baked
    # CMD had the stale pre-reorganization path.
    command: Rscript /share/github/CalCOFI/api/run-api.R
    ports:
      - 8888:8888
    restart: unless-stopped
    volumes:
      - /share:/share
    depends_on:
      - postgis

  pg_tileserv:
    container_name: pg_tileserv
    environment:
      DATABASE_URL: postgres://admin:$PASSWORD@postgis:5432/gis
    image: pramsey/pg_tileserv:latest
    build:
      context: ./pg_tileserv
      dockerfile: Dockerfile.alpine
      args:
        VERSION: latest
    restart: unless-stopped
    depends_on:
      - postgis
    ports:
      - 7800:7800

  # Self-heal guard for ERDDAP config. ERDDAP's content dir is a bind-mount of
  # the CalCOFI/erddap repo (cloned to /share/github/CalCOFI/erddap). If that
  # clone is absent, Docker silently auto-creates an EMPTY mount dir, ERDDAP
  # boots with no setup.xml, and every request to /erddap returns "404 Not
  # Found" with no obvious cause. This one-shot container detects the missing
  # config and clones it into the content dir, so a fresh host self-heals and
  # the failure is loud in the logs instead of a silent 404.
  erddap_init:
    container_name: erddap_init
    image: alpine/git:latest
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -f /content/setup.xml ]; then
          echo "[erddap_init] content/setup.xml present - OK";
        else
          echo "[erddap_init] content/setup.xml MISSING - cloning CalCOFI/erddap config...";
          git clone --depth 1 https://github.com/CalCOFI/erddap.git /tmp/cfg \
            && cp -a /tmp/cfg/content/. /content/ \
            && echo "[erddap_init] seeded content from CalCOFI/erddap" \
            || { echo "[erddap_init] FAILED to seed ERDDAP content"; exit 1; };
        fi
    volumes:
      - /share/github/CalCOFI/erddap/content:/content
    restart: "no"

  erddap:
    container_name: erddap
    # Custom image = stock ERDDAP + DuckDB JDBC driver (./erddap/Dockerfile), so
    # EDDTableFromDatabase can serve the CTD tables via DuckDB views over Parquet
    # (streams filtered rows; the old ctd_wide EDDTableFromParquetFiles OOM'd).
    # Roll back: revert to `image: erddap/erddap:latest` + drop the duckdb mounts.
    build:
      context: ./erddap
      args:
        DUCKDB_JDBC_VERSION: "1.5.2.1"
    image: calcofi-erddap:duckdb
    restart: unless-stopped
    depends_on:
      erddap_init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    volumes:
      - /share/github/CalCOFI/erddap/content:/usr/local/tomcat/content/erddap
      - /share/erddap/data:/erddapData
      - /share/erddap/datasets:/datasets
      # CalCOFI branding. The webapp dir is baked into the image (not persistent):
      #  - logo served at /erddap/images/calcofi.svg (referenced by startBodyHtml5)
      #  - messages.xml overrides only <startBodyHtml5> for the CalCOFI header.
      # NOTE: a content/erddap/messages.xml does NOT work in ERDDAP 2.30.0 (it
      # replaces the default base and is parsed with stricter flags), so the
      # edited file is mounted over the classpath messages.xml instead. It is a
      # full copy of the image default with only startBodyHtml5 changed; re-derive
      # it from the new default on ERDDAP upgrade.
      - /share/github/CalCOFI/erddap/content/images/calcofi.svg:/usr/local/tomcat/webapps/erddap/images/calcofi.svg:ro
      - /share/github/CalCOFI/erddap/messages.xml:/usr/local/tomcat/webapps/erddap/WEB-INF/classes/gov/noaa/pfel/erddap/util/messages.xml:ro
      # DuckDB serving for calcofi_ctd_thin / calcofi_ctd_measurement. The data
      # tree lives under the shared /share mount (host /ssd/share/data), so the
      # .db's read_parquet() view paths resolve identically where the .db is
      # built (rstudio) and where ERDDAP reads it (here) — no /ssd identity hack.
      - /share/data/erddap-duckdb/datasets:/share/data/erddap-duckdb/datasets:ro
      - /share/data/erddap-duckdb/duckdb:/share/data/erddap-duckdb/duckdb:ro
      - /share/data/erddap-duckdb/tmp:/share/data/erddap-duckdb/tmp
    environment:
      ERDDAP_MEMORY: 4g
      ERDDAP_baseUrl: http://localhost:8090
      ERDDAP_baseHttpsUrl: https://erddap.calcofi.io
      # Stable flagKeyKey (secret, from .env). Without it the entrypoint
      # generates a new random value on every restart, invalidating dataset
      # reload flag URLs and email-subscription keys.
      ERDDAP_flagKeyKey: ${ERDDAP_flagKeyKey}
      ERDDAP_bigParentDirectory: /erddapData/
      ERDDAP_adminInstitution: CalCOFI
      ERDDAP_adminInstitutionUrl: https://calcofi.io
      ERDDAP_adminIndividualName: CalCOFI Data Manager
      ERDDAP_adminPosition: Data Manager
      ERDDAP_adminCity: La Jolla
      ERDDAP_adminStateOrProvince: CA
      ERDDAP_adminPostalCode: "92037"
      ERDDAP_adminCountry: USA
      ERDDAP_adminEmail: calcofi@ucsd.edu

  # FastAPI port of api-h3t (CalCOFI/api-h3t-py) serving h3t.calcofi.io behind
  # Varnish (varnish/default.vcl backend). Replaced the R Plumber service
  # (h3t_api), decommissioned after cutover. Same wire protocol.
  # See api-h3t-py/deploy.md for the cutover/rollback history.
  h3t_api_py:
    container_name: h3t_api_py
    build: /share/github/CalCOFI/api-h3t-py
    restart: unless-stopped
    environment:
      # legacy single-DB mode → registers as db name "default".
      DUCKDB_PATH: /data/calcofi_latest.duckdb
      H3T_PORT: 8889
      H3T_HOST: 0.0.0.0
      # Varnish strips Accept-Encoding before the cache lookup and Caddy gzips
      # at the edge, so the backend always serves plain JSON.
      H3T_APP_GZIP: "false"
    volumes:
      # mount the released DuckDB files read-only. calcofi_latest.duckdb
      # is a symlink to the current versioned release.
      - /share/github/CalCOFI/db-viz-hex/data:/data:ro
    expose:
      - "8889"

  varnish:
    container_name: varnish
    image: varnish:7
    restart: unless-stopped
    environment:
      VARNISH_SIZE: 1G
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    expose:
      - "80"
    depends_on:
      # Varnish compiles its VCL at startup, which resolves the backend
      # hostname via DNS. If the backend isn't running yet, compile fails.
      h3t_api_py:
        condition: service_healthy
